name: ci

# Forgejo Actions CI. This instance's runners are hostexecutor: no job gets an
# automatic clone, so EVERY job must start with actions/checkout.
# `push` is scoped to `main` and the `v2` integration branch. With `push` on
# every branch AND `pull_request`, an open PR makes each push fire TWO runs
# of the same commit on the same host — not merely wasteful (2 x ~5m40s on a
# shared runner) but actively breaking: the two runs raced over a shared
# throwaway test database and one deleted the other's mid-test (run 12259 red,
# identical push run green). Feature-branch work is covered by its PR run;
# `main` and `v2` (the integration branch that feature PRs target) are covered
# here. A long-lived `v2`→`main` PR would re-introduce the double run on
# pushes to `v2`; keep that PR short-lived (drill-green only).
on:
  push:
    branches: [main, v2]
  pull_request:

# Scoped off main so a merge run is never cancelled by a later push.
# Verified that this instance actually interpolates the expression rather than
# storing it literally — `action_run.concurrency_group` holds distinct per-ref
# values (`ci-ci.yml-refs/pull/1/head`, `ci-ci.yml-refs/heads/main`, ...). A
# literal group here would collapse every branch into one and cross-cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No `permissions:` block. Forgejo does not implement it and emits a workflow
# warning saying so — it is GitHub Actions syntax that reads like a security
# control here while granting and restricting nothing. Capabilities on this
# instance come from Authorized Integrations, not from workflow YAML. Leaving
# a no-op `contents: read` in place would be worse than omitting it, because
# it looks like the job is sandboxed when it is not.

jobs:
  gate:
    name: ruff + mypy + pytest
    runs-on: [macos-arm64, quick]
    # The quick lane's daemon enforces `timeout: 25m`. A `timeout-minutes:`
    # ABOVE that is not honoured — the daemon kills the job and reports it
    # CANCELLED rather than failed, which reads as a hang (run 12292). 20 keeps
    # this under the daemon's cap so a real overrun still reports as a failure.
    #
    # 12 was too tight, and not because of the tests. Measured on run 12298:
    # checkout took 2 seconds and `uv sync --frozen --all-extras` took 11.5
    # minutes. The runner wipes its workdir every job, so the venv — torch,
    # sentence-transformers, the lot — is rebuilt from scratch each time. The
    # fast test suite itself is about 8 seconds.
    timeout-minutes: 20
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /tmp/hostedtoolcache
      UV_PYTHON: "3.13"
      # pytest basetemps inside the job workdir, never the runner's shared temp
      # dir. A job the daemon SIGKILLs leaves its basetemp locked and pytest
      # never reclaims it — 2,951 of those were 108GB on the internal disk on
      # 2026-09-04. In the workdir the teardown step below wipes it.
      TMPDIR: ${{ github.workspace }}/.pytest-tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history. The secret scan below reads the git log, and on the
          # default shallow clone it would see exactly one commit and report
          # clean every time — a scanner that always passes is worse than none,
          # because it is believed. The repo is ~6 MB, so this costs nothing.
          fetch-depth: 0

      # uv is installed on the Mac runners at ~/.local/bin/uv. `uv sync
      # --frozen` refuses to update uv.lock, so a lock that drifted from
      # pyproject.toml fails CI instead of being silently repaired.
      - name: Sync environment (frozen lock)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv --version
          uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check .
          uv run ruff format --check .

      # Scans HISTORY, not the working tree: a secret that was committed and
      # later deleted is still in the repo, and this one goes public.
      - name: Secret scan (gitleaks, full history)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

      - name: Type check (mypy --strict)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy

      # Fast tests only. The corpus-scale integration tests run in `full-suite`
      # below, on the lane sized for them. This job exists to say "the code is
      # wrong" in a couple of minutes, not to be exhaustive.
      - name: Test (fast subset)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Hostexecutor runners also inject a lane-shared TMPDIR
          # (/Volumes/.../CI/tmp/quick). Job-level env does not always win, and
          # when that shared parent is missing mid-run pytest dies with
          # FileNotFoundError on pytest-of-* (PR #18 run 87). Force the
          # workspace path in-step and pin --basetemp so basetemps never land
          # on the shared lane dir.
          export TMPDIR="${GITHUB_WORKSPACE:-$PWD}/.pytest-tmp"
          mkdir -p "$TMPDIR"
          uv run pytest -q --no-cov -m "not integration and not slow and not llm" \
            --basetemp="$TMPDIR/basetemp"

      # `always()` so a red or timed-out test step still leaves no scratch behind.
      - name: Teardown pytest scratch
        if: always()
        run: |
          export TMPDIR="${GITHUB_WORKSPACE:-$PWD}/.pytest-tmp"
          rm -rf "$TMPDIR"

  # Everything expensive, on the heavy lane (daemon cap 2h). This is the
  # authoritative run: the whole suite, integration tests included, with the
  # coverage floor enforced over all of it. Separate job so a lint error does
  # not wait behind a 20-minute corpus load, and a separate LANE so the two do
  # not contend for one host — which is the failure mode this repo keeps
  # rediscovering.
  full-suite:
    name: full suite + coverage floor
    # `heavy`, not `e2e`: both heavy runners carry `heavy` while only
    # mac-heavy-1 carries `e2e`, so asking for e2e serialises this behind every
    # other repo's e2e queue on a single machine — observed, with this job
    # sitting in state 5 behind another project's backlog. Nothing here needs
    # e2e specifically; it needs "not the quick lane".
    runs-on: [macos-arm64, heavy]
    timeout-minutes: 45
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /tmp/hostedtoolcache
      UV_PYTHON: "3.13"
      # pytest basetemps inside the job workdir, never the runner's shared temp
      # dir. A job the daemon SIGKILLs leaves its basetemp locked and pytest
      # never reclaims it — 2,951 of those were 108GB on the internal disk on
      # 2026-09-04. In the workdir the teardown step below wipes it.
      TMPDIR: ${{ github.workspace }}/.pytest-tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Sync environment (frozen lock)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv --version
          uv sync --frozen --all-extras

      - name: Test (full suite + coverage floor)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Same hostexecutor TMPDIR override as the gate job — see comment there.
          export TMPDIR="${GITHUB_WORKSPACE:-$PWD}/.pytest-tmp"
          mkdir -p "$TMPDIR"
          uv run pytest -q --cov --cov-report=term-missing \
            --basetemp="$TMPDIR/basetemp"

      - name: Teardown pytest scratch
        if: always()
        run: |
          export TMPDIR="${GITHUB_WORKSPACE:-$PWD}/.pytest-tmp"
          rm -rf "$TMPDIR"

  # Canonical PR-side graph guard — see studio-kit ci/graphify/graph-guard.yml.
  # PRs must NOT touch graphify-out/: the committed graph is refreshed on
  # main/v2 by graph-refresh after each merge. Homelib adaptations vs the
  # studio-kit template (documented here; do not silent-edit the template):
  # runs-on uses this repo's [macos-arm64, quick] labels (not `native`);
  # graph-refresh pushes HEAD:$GITHUB_REF_NAME for main|v2 only (canonical
  # template always pushes HEAD:main, which would no-op on v2). Bootstrap:
  # this PR wires the jobs but does NOT commit graphify-out/; the first
  # post-merge refresh creates it so the guard never gates its own bootstrap.
  graph-guard:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: [macos-arm64, quick]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up PATH (LaunchAgent-spawned runner has a minimal one)
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: PRs must not touch graphify-out/
        run: |
          git fetch origin "${GITHUB_BASE_REF:-main}" --quiet
          touched="$(git diff --name-only "origin/${GITHUB_BASE_REF:-main}...HEAD" -- graphify-out/)"
          if [ -n "$touched" ]; then
            echo "$touched"
            echo "::error::PR modifies committed graph artifacts — drop the graphify-out/ delta; the graph-refresh job regenerates it on main/v2 after merge"
            exit 1
          fi
          echo "graphify-out/ untouched"
      - name: Graph generation smoke (advisory)
        run: |
          command -v graphify >/dev/null || { echo "::warning::graphify not installed on runner — skipping"; exit 0; }
          # PYTHONHASHSEED pinned: graphify's import tie-breaks and community
          # detection follow Python hash order — unpinned, identical input can
          # produce different graphs (live-observed).
          PYTHONHASHSEED=0 graphify update . >/dev/null || { echo "::warning::graphify update failed on this tree — the post-merge refresh will fail the same way"; exit 0; }
          echo "graph generation OK"

  # Canonical post-merge graph refresh — see studio-kit ci/graphify/graph-refresh.yml.
  # Homelib: push to the protected branch that was just pushed (main or v2),
  # not always main. Feature-branch pushes never reach this job (workflow
  # `on.push.branches` is [main, v2] only); the ref check is belt-and-braces.
  graph-refresh:
    if: ${{ github.event_name == 'push' }}
    runs-on: [macos-arm64, quick]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up PATH (LaunchAgent-spawned runner has a minimal one)
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Refresh committed graph (fail-open — a broken refresh must not block CI)
        run: |
          ref="${GITHUB_REF_NAME:-}"
          case "$ref" in
            main|v2) ;;
            *)
              echo "::warning::graph-refresh refusing to push to non-protected ref $ref"
              exit 0
              ;;
          esac
          command -v graphify >/dev/null || { echo "::warning::graphify not installed on runner — graph not refreshed"; exit 0; }
          PYTHONHASHSEED=0 graphify update . >/dev/null || { echo "::warning::graphify update failed — graph not refreshed"; exit 0; }
          # built_at_commit records the rebuilding HEAD; filter it. Textual
          # diff because --quiet short-circuits on blob identity BEFORE -I
          # applies (git 2.50) and would always report drift.
          if [ -z "$(git diff -I '"built_at_commit"' -- graphify-out/graph.json)" ]; then
            echo "graph is fresh"
            exit 0
          fi
          git add graphify-out/
          git -c user.name="graph-refresh-bot" -c user.email="graph-refresh-bot@noreply.localhost" \
            commit -m "chore(graph): refresh ${ref} post-merge"
          # Race-safe: non-FF is self-healing on the next merge's run.
          ALLOW_PUSH_TO_MAIN=1 git push origin "HEAD:${ref}" || { echo "::warning::push to ${ref} failed (non-FF race is self-healing; an auth error needs a token with write access)"; exit 0; }
          echo "graph refreshed and pushed to ${ref} — the retriggered run verifies freshness"
