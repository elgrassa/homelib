<style>
  #hl-rotunda {
    /* Dark jewel on the parchment Streamlit shell — MagicLib mockup language
       (gold bloom, teal seal, warm candle light) without flipping page theme. */
    color-scheme: light;
    --hl-ink: #f3e6c8;
    --hl-muted: #c9baa5;
    --hl-shell: #0c1612;
    --hl-panel: #1a241c;
    --hl-panel-2: #243028;
    --hl-line: #66523d;
    --hl-gold: #e2b85f;
    --hl-gold-soft: #4a391f;
    --hl-teal: #4fd1c5;
    --hl-teal-dim: color-mix(in srgb, #4fd1c5 35%, transparent);
    --hl-candle: #d4893a;
    color: var(--hl-ink);
    font-family: Georgia, "Times New Roman", serif;
    width: 100%;
    /* Reserve height so Ask widgets below do not jump (CLS). */
    min-height: 460px;
  }
  #hl-rotunda * { box-sizing: border-box; }
  #hl-rotunda .hl-room {
    position: relative; height: 380px; max-width: 920px; margin: 0 auto; overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--hl-gold) 45%, var(--hl-line));
    border-radius: 20px;
    background:
      radial-gradient(ellipse 55% 40% at 50% 108%, var(--hl-teal-dim), transparent 70%),
      radial-gradient(circle at 12% 78%, color-mix(in srgb, var(--hl-candle) 38%, transparent), transparent 28%),
      radial-gradient(circle at 88% 22%, color-mix(in srgb, var(--hl-gold) 18%, transparent), transparent 32%),
      radial-gradient(ellipse at 50% 0%, color-mix(in srgb, #1e3a32 80%, transparent), transparent 55%),
      linear-gradient(180deg, #15221c 0%, var(--hl-shell) 55%, #080e0c 100%);
    perspective: 980px;
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--hl-teal) 18%, transparent),
      0 28px 60px color-mix(in srgb, #000 55%, transparent),
      inset 0 0 80px color-mix(in srgb, #000 35%, transparent);
  }
  /* Soft mote field — magic dust without a particle library. */
  #hl-rotunda .hl-room::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.55;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, var(--hl-gold), transparent),
      radial-gradient(1px 1px at 28% 62%, #fff8, transparent),
      radial-gradient(1.5px 1.5px at 44% 28%, var(--hl-teal), transparent),
      radial-gradient(1px 1px at 61% 74%, var(--hl-gold), transparent),
      radial-gradient(1.5px 1.5px at 76% 22%, #fff6, transparent),
      radial-gradient(1px 1px at 88% 58%, var(--hl-teal), transparent),
      radial-gradient(1px 1px at 18% 88%, var(--hl-gold), transparent),
      radial-gradient(1.5px 1.5px at 52% 48%, #fff5, transparent);
    animation: hl-motes 9s ease-in-out infinite alternate;
  }
  /* Floor seal / compass bloom (mockup teal geometry). */
  #hl-rotunda .hl-room::after {
    content: ""; position: absolute; left: 50%; bottom: -40px; z-index: 2;
    width: min(72%, 420px); height: 160px; transform: translateX(-50%) rotateX(68deg);
    border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--hl-teal) 55%, transparent);
    box-shadow:
      0 0 24px var(--hl-teal-dim),
      0 0 60px color-mix(in srgb, var(--hl-teal) 22%, transparent),
      inset 0 0 30px color-mix(in srgb, var(--hl-teal) 25%, transparent);
    background:
      repeating-conic-gradient(from 0deg, transparent 0 8deg, color-mix(in srgb, var(--hl-teal) 18%, transparent) 8deg 9deg),
      radial-gradient(circle, color-mix(in srgb, var(--hl-teal) 22%, transparent) 0 18%, transparent 42%);
    animation: hl-seal-pulse 3.6s ease-in-out infinite;
    pointer-events: none;
  }
  #hl-rotunda .hl-compass {
    position: absolute; top: 14px; left: 16px; z-index: 5;
    color: var(--hl-muted); font: 13px system-ui, sans-serif;
    letter-spacing: 0.04em; text-shadow: 0 0 12px color-mix(in srgb, var(--hl-teal) 40%, transparent);
  }
  #hl-rotunda .hl-stage {
    position: absolute; inset: 50% auto auto 50%; width: 0; height: 0; z-index: 3;
    transform-style: preserve-3d; transition: transform 700ms cubic-bezier(.2,.75,.25,1);
  }
  #hl-rotunda .hl-door {
    position: absolute; left: -72px; top: -122px; width: 144px; height: 244px;
    min-width: 44px; min-height: 44px;
    border: 0; padding: 0; color: var(--hl-ink); background: transparent; cursor: pointer;
    transform-style: preserve-3d; font: inherit;
  }
  #hl-rotunda .hl-door-face {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    gap: 8px; padding: 18px 10px; border: 2px solid color-mix(in srgb, var(--hl-gold) 40%, var(--hl-line));
    border-radius: 72px 72px 10px 10px;
    background:
      radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--hl-gold) 22%, transparent), transparent 42%),
      radial-gradient(circle at 76% 50%, var(--hl-gold) 0 3px, transparent 4px),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--hl-line) 35%, transparent) 0 1px, transparent 1px 26px),
      linear-gradient(180deg, #2a3830 0%, #161e19 100%);
    box-shadow:
      inset 0 0 0 7px color-mix(in srgb, var(--hl-line) 30%, transparent),
      0 18px 36px color-mix(in srgb, #000 45%, transparent);
    transition: transform 240ms ease, border-color 240ms ease, box-shadow 240ms ease, filter 240ms ease;
    backface-visibility: hidden;
  }
  #hl-rotunda .hl-door:hover .hl-door-face,
  #hl-rotunda .hl-door:focus-visible .hl-door-face {
    transform: translateY(-6px);
    border-color: var(--hl-gold);
    filter: brightness(1.08);
    box-shadow:
      inset 0 0 0 7px color-mix(in srgb, var(--hl-gold) 28%, transparent),
      0 0 28px color-mix(in srgb, var(--hl-gold) 35%, transparent);
  }
  #hl-rotunda .hl-door[aria-pressed="true"] .hl-door-face {
    border-color: var(--hl-gold);
    background:
      radial-gradient(circle at 50% 18%, color-mix(in srgb, #fff6d5 55%, transparent), transparent 38%),
      radial-gradient(circle at 50% 100%, color-mix(in srgb, var(--hl-candle) 35%, transparent), transparent 55%),
      radial-gradient(circle at 76% 50%, var(--hl-gold) 0 3px, transparent 4px),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--hl-line) 28%, transparent) 0 1px, transparent 1px 26px),
      linear-gradient(180deg, #3a4a38 0%, #1a221c 100%);
    box-shadow:
      inset 0 0 0 8px color-mix(in srgb, var(--hl-gold) 40%, transparent),
      0 0 36px color-mix(in srgb, var(--hl-gold) 55%, transparent),
      0 0 72px color-mix(in srgb, var(--hl-candle) 30%, transparent);
    animation: hl-door-glow 2.8s ease-in-out infinite;
  }
  #hl-rotunda .hl-door-name {
    max-width: 118px; font-weight: 500; line-height: 1.15; text-align: center;
    text-shadow: 0 0 18px color-mix(in srgb, var(--hl-gold) 35%, transparent);
  }
  #hl-rotunda .hl-door-kind {
    color: var(--hl-muted); font: 11px system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
  }
  #hl-rotunda .hl-turn {
    position: absolute; right: 14px; top: 12px; z-index: 6; min-height: 44px; padding: 8px 12px;
    border: 1px solid color-mix(in srgb, var(--hl-gold) 70%, transparent); border-radius: 10px;
    color: var(--hl-ink); background: color-mix(in srgb, var(--hl-panel) 82%, transparent);
    font: 500 14px system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 0 16px color-mix(in srgb, var(--hl-gold) 22%, transparent);
    backdrop-filter: blur(6px);
  }
  #hl-rotunda .hl-turn:hover {
    border-color: var(--hl-gold);
    box-shadow: 0 0 24px color-mix(in srgb, var(--hl-gold) 40%, transparent);
  }
  #hl-rotunda .hl-result {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; max-width: 920px;
    margin: 14px auto 0; padding: 16px 18px;
    border: 1px solid color-mix(in srgb, var(--hl-gold) 35%, var(--hl-line));
    border-radius: 14px;
    background: color-mix(in srgb, var(--hl-panel) 88%, transparent);
    box-shadow:
      0 12px 40px color-mix(in srgb, #000 35%, transparent),
      inset 0 0 40px color-mix(in srgb, var(--hl-teal) 6%, transparent);
    font-family: system-ui, sans-serif;
    backdrop-filter: blur(8px);
  }
  #hl-rotunda .hl-result h2 {
    margin: 0 0 4px; font: 500 18px Georgia, serif; color: var(--hl-ink);
    text-shadow: 0 0 20px color-mix(in srgb, var(--hl-gold) 30%, transparent);
  }
  #hl-rotunda .hl-result p { margin: 0; color: #d4c4a8; }
  #hl-rotunda .hl-enter-link {
    display: inline-block; min-height: 44px; line-height: 44px; padding: 0 18px; border-radius: 10px;
    border: 1px solid var(--hl-gold); color: #1a140c; background: var(--hl-gold);
    font: 500 14px system-ui, sans-serif; text-decoration: none; white-space: nowrap;
    box-shadow: 0 0 22px color-mix(in srgb, var(--hl-gold) 45%, transparent);
  }
  #hl-rotunda .hl-enter-link:hover {
    box-shadow: 0 0 34px color-mix(in srgb, var(--hl-gold) 65%, transparent);
  }
  #hl-rotunda .hl-enter-link[hidden] { display: none; }
  @keyframes hl-motes {
    from { transform: translateY(0); opacity: 0.4; }
    to { transform: translateY(-10px); opacity: 0.7; }
  }
  @keyframes hl-seal-pulse {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 20px var(--hl-teal-dim), inset 0 0 24px color-mix(in srgb, var(--hl-teal) 20%, transparent); }
    50% { opacity: 0.95; box-shadow: 0 0 40px color-mix(in srgb, var(--hl-teal) 40%, transparent), inset 0 0 36px color-mix(in srgb, var(--hl-teal) 30%, transparent); }
  }
  @keyframes hl-door-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); }
  }
  #hl-rotunda.hl-reduced .hl-stage,
  #hl-rotunda.hl-reduced .hl-door-face,
  #hl-rotunda.hl-reduced .hl-room::before,
  #hl-rotunda.hl-reduced .hl-room::after,
  #hl-rotunda.hl-reduced .hl-door[aria-pressed="true"] .hl-door-face {
    animation: none; transition: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #hl-rotunda .hl-stage,
    #hl-rotunda .hl-door-face,
    #hl-rotunda .hl-room::before,
    #hl-rotunda .hl-room::after,
    #hl-rotunda .hl-door[aria-pressed="true"] .hl-door-face {
      animation: none; transition: none;
    }
  }
  @media (max-width: 720px) {
    #hl-rotunda { min-height: 500px; }
    #hl-rotunda .hl-room { height: 400px; }
    #hl-rotunda .hl-door { left: -60px; width: 120px; height: 210px; }
    #hl-rotunda .hl-result { grid-template-columns: 1fr; }
  }
</style>
<div id="hl-rotunda" class="hl-rotunda__MOTION_CLASS__">
  <section class="hl-room" aria-label="Rotating library room">
    <div class="hl-compass" id="hl-compass">Facing: __ACTIVE_ESCAPED__</div>
    <button type="button" class="hl-turn" id="hl-turn">↻ Turn the room</button>
    <div class="hl-stage" id="hl-stage"></div>
  </section>
  <section class="hl-result" aria-live="polite">
    <div>
      <h2 id="hl-result-title">__ACTIVE_ESCAPED__</h2>
      <p id="hl-result-copy">__ACTIVE_COPY_ESCAPED__</p>
    </div>
    <div class="hl-actions" id="hl-actions">
__ENTER_LINKS__
    </div>
  </section>
</div>
<script>
(() => {
  const doors = __LABELS_JSON__;
  const copy = __COPY_JSON__;
  const roots = document.querySelectorAll('#hl-rotunda');
  const root = roots[roots.length - 1];
  if (!root || root.dataset.hlReady === '1') { return; }
  root.dataset.hlReady = '1';
  const stage = root.querySelector('#hl-stage');
  const compass = root.querySelector('#hl-compass');
  const title = root.querySelector('#hl-result-title');
  const copyEl = root.querySelector('#hl-result-copy');
  const links = Array.from(root.querySelectorAll('.hl-enter-link'));
  let active = __ACTIVE_INDEX__;
  const angle = 360 / doors.length;

  function enter(name) {
    // Same-document navigation: this script runs inline in the Streamlit page
    // (st.html), so `?door=NAME` reloads the Crossroads on the chosen door.
    // No less-than sign anywhere in this script: DOMPurify (SAFE_FOR_XML)
    // drops the whole element when its text looks like markup.
    // Script cannot touch st.session_state; app.py reads the param instead.
    window.location.assign('?door=' + encodeURIComponent(name));
  }

  doors.forEach((name, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'hl-door';
    button.dataset.door = name;
    button.setAttribute('aria-label', 'Face ' + name);
    button.setAttribute('aria-pressed', index === active ? 'true' : 'false');
    const face = document.createElement('span');
    face.className = 'hl-door-face';
    const glyph = document.createElement('span'); glyph.textContent = '✧'; glyph.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span'); label.className = 'hl-door-name'; label.textContent = name;
    const kind = document.createElement('span'); kind.className = 'hl-door-kind'; kind.textContent = 'door';
    face.append(glyph, label, kind);
    button.appendChild(face);
    button.style.transform = 'rotateY(' + (index * angle) + 'deg) translateZ(300px)';
    button.addEventListener('click', () => {
      if (index === active) { enter(name); return; }
      face_door(index);
    });
    stage.appendChild(button);
  });

  function face_door(index) {
    active = (index + doors.length) % doors.length;
    stage.style.transform = 'rotateY(' + (-active * angle) + 'deg)';
    root.querySelectorAll('.hl-door').forEach((door, i) => door.setAttribute('aria-pressed', i === active ? 'true' : 'false'));
    compass.textContent = 'Facing: ' + doors[active];
    title.textContent = doors[active];
    copyEl.textContent = copy[doors[active]] || '';
    links.forEach((a, i) => { a.hidden = i !== active; });
  }

  root.querySelector('#hl-turn').addEventListener('click', () => face_door(active + 1));
  face_door(active);
})();
</script>
