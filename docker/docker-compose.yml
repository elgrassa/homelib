# homelib — the entire solution in one stack.
#
# Reviewer path, start to finish (Groq for Ask/Mentor/Roadmap — add
# GROQ_API_KEY to .env; never commit the key):
#   cp .env.example .env   # then paste GROQ_API_KEY
#   docker compose -p homelib --env-file .env -f docker/docker-compose.yml up -d --build
#   docker compose -p homelib --env-file .env -f docker/docker-compose.yml --profile seed run --rm ingest
#   docker compose -p homelib --env-file .env -f docker/docker-compose.yml --profile seed run --rm ingest python -m apps.ingest.sqlite_pipeline
#   open http://localhost:8501
#
# Optional local Ollama fallback: add `--profile local-llm` and set
# LLM_API_KEY=ollama (see .env.example). Default up does not wait on Ollama.
#
# Every port binds to 127.0.0.1: this stack is a local application, not a
# service exposed to the network. Each host port is overridable from .env
# (API_PORT, UI_PORT, GRAFANA_PORT, POSTGRES_PORT, OLLAMA_PORT) — the defaults
# are what the README documents, but a machine already running Postgres or
# Ollama should not have to edit this file to try the project. Every long-running service declares a
# healthcheck, and dependants wait on `service_healthy` rather than racing a
# container that is up but not yet listening.
#
# Every image is pinned by digest as well as tag. The tag says what it is and
# stays readable; the digest is what actually runs, so a rebuild months from
# now gets the same bytes this stack was verified against. Digests were read
# from images actually pulled on 2026-08-30, not copied from a registry page.

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f  # PostgreSQL 17.11
    environment:
      POSTGRES_USER: homelib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: homelib
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelib -d homelib"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: [local-llm]
    environment:
      # Pinned, because leaving it to the image default is a "works on my
      # machine" trap of the worst kind: it fails SILENTLY. Ollama truncates an
      # over-long prompt rather than erroring, so the model simply answers a
      # question it was only shown part of.
      #
      # Measured on the dev box: an /v1/ask prompt at k=5 is ~1,900 tokens, and
      # `_MAX_CONTEXT_HITS` allows up to 20 passages, which reaches ~7,600. The
      # dev machine happens to have OLLAMA_CONTEXT_LENGTH=32768 set globally, so
      # none of that was ever visible here — a reviewer running the default
      # would get a fraction of that window and truncation we would never see.
      # 16384 covers the 20-passage ceiling with room left to generate into.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-16384}"
    volumes:
      - ollama:/root/.ollama
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: pulls the chat model so the first /v1/ask never cold-fails on a
  # missing model. Runs to completion and exits; `restart: no` keeps it exited.
  # Profile local-llm only — Groq is the default Ask path.
  model-init:
    image: ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: [local-llm]
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${LLM_MODEL:-qwen2.5:7b-instruct}"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://homelib:${POSTGRES_PASSWORD}@postgres:5432/homelib
      # Groq when GROQ_API_KEY is set and LLM_API_KEY is blank (OpenAIClient
      # fallback). Do not default LLM_API_KEY to "ollama" — that hid Groq.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_PRICE_PER_1K_PROMPT: ${LLM_PRICE_PER_1K_PROMPT:-0}
      LLM_PRICE_PER_1K_COMPLETION: ${LLM_PRICE_PER_1K_COMPLETION:-0}
      HOMELIB_DEMO_LLM_DAILY_LIMIT: ${HOMELIB_DEMO_LLM_DAILY_LIMIT:-100}
      # Pinned like the ui service: .env.example ships APP_MODE=demo for the
      # Community Cloud path, and a demo-mode API mints a fresh anonymous
      # principal per header-less request — the reviewer stack is selfhosted.
      APP_MODE: selfhosted
      # v2 Crossroads doors (Coffee Table, playlists, observatory, …) require
      # SQLite. When set, health/books/ask/feedback also prefer this store;
      # DATABASE_URL stays for Postgres ingest / unset-SQLite runs.
      HOMELIB_SQLITE_PATH: ${HOMELIB_SQLITE_PATH:-/data/homelib.sqlite}
    volumes:
      # RW: progress, playlists, demo_session, query_log write here. Seed the
      # host file first (`run_sqlite_pipeline`) — expected counts 18/729/9168.
      - ../data:/data
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # `just seed`. Behind a profile so `up -d` does not run it implicitly —
  # ingestion is idempotent, but it should still be a deliberate step.
  ingest:
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
    environment:
      DATABASE_URL: postgresql://homelib:${POSTGRES_PASSWORD}@postgres:5432/homelib
      SNAPSHOT: /data/corpus_snapshot.jsonl.gz
      CATALOG: /data/catalog.jsonl
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      # `just seed-sqlite` runs `python -m apps.ingest.sqlite_pipeline` in this
      # same one-shot; it writes the file the api service reads (ADR-004).
      HOMELIB_SQLITE_PATH: /data/homelib.sqlite
    volumes:
      # RW: the SQLite seed and its dlt staging DB are written here.
      - ../data:/data
    depends_on:
      postgres: {condition: service_healthy}
    profiles: [seed]

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    environment:
      # Always HTTP to the api service. APP_MODE=demo is Cloud / local
      # `streamlit run` only (InProcessClient); do not inherit .env demo here.
      API_URL: http://api:8000
      APP_MODE: selfhosted
      # Clean /read HTML for iPad Safari Listen to Page (same container).
      READ_API_URL: http://api:8000
      # Host-facing port for link text only (apps/ui renders READ_PORT into
      # /read/{book_id} URLs). The read server itself always binds 8502
      # inside the container regardless of this value — see ui-entrypoint.sh.
      READ_PORT: ${READ_PORT:-8502}
      # Opt-in, off by default: enables the :8502 /pdf proxy + two-page
      # viewer. Owner's LAN only; never set for the public demo.
      HOMELIB_OFFICIAL_VIEWER: ${HOMELIB_OFFICIAL_VIEWER:-}
    # home LAN: set HOMELIB_UI_BIND=0.0.0.0 in .env; reviewer default stays
    # loopback.
    ports:
      - "${HOMELIB_UI_BIND:-127.0.0.1}:${UI_PORT:-8501}:8501"
      - "${HOMELIB_UI_BIND:-127.0.0.1}:${READ_PORT:-8502}:8502"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8501/_stcore/health && curl -fs http://localhost:8502/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
  ollama: {}
  grafana: {}
