[project]
name = "homelib-core"
version = "0.1.0"
description = "homelib domain model: BookDoc/Block/Chunk, format handlers, chunking"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic==2.13.5",
    "ebooklib==0.20",
    "lxml==6.1.2",
    "pypdf==6.16.2",
]

[project.optional-dependencies]
# OCR fallback for scanned PDFs. Optional: import-guarded, fails loudly at the
# use site rather than at import time (see formats/pdf.py).
ocr = ["pymupdf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelib_core"]
