[project]
name = "homelib-rag"
version = "0.1.0"
description = "homelib retrieval: lexical + vector index, RRF hybrid, rerank, rewrite, agent tools"
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "homelib-core",
    "numpy==2.3.2",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "openai==3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelib_rag"]

[tool.uv.sources]
homelib-core = { workspace = true }
