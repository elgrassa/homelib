# homelib — workspace root (virtual: not itself a distributable package).
#
# Layout (see docs/architecture.md):
#   packages/homelib-core  installable: models, format handlers, chunking
#   packages/homelib-rag   installable: indexing, hybrid, rerank, agent
#   apps/, evals/, scripts/  plain importable trees (pythonpath below)
#
# Exact pins only. uv.lock is the source of truth; bumps go via PR.
[project]
name = "homelib"
version = "0.1.0"
description = "Personal library: ingest any book format, ask it questions with block-level citations, get a reading roadmap"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Pavlo Korodziievskyi" }]

dependencies = [
    "homelib-core",
    "homelib-rag",
    # api / ui
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "streamlit==1.62.0",
    # data
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "dlt[postgres,sqlalchemy]==1.30.0",
    "sqlalchemy==2.0.43",
    # llm + embeddings
    "openai==3.6.0",
    "sentence-transformers==6.0.0",
    # Declared explicitly only so the CPU-only index below applies to it.
    # sentence-transformers would otherwise pull it transitively, and on
    # linux/amd64 that means the CUDA build: 2.9 GB of nvidia-* wheels plus
    # 652 MB of triton, in an image that never sees a GPU.
    "torch==2.10.0",
    # misc
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.167.0",
    "respx==0.23.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260815",
    # OCR is an optional extra of homelib-core so production installs stay slim,
    # but the scanned-PDF path is a real feature and must be exercised by the
    # suite rather than skipped — so dev/CI installs it explicitly.
    "pymupdf==1.28.2",
]

[tool.uv]
package = false

# PyTorch publishes CPU-only wheels on a separate index. Without this, the
# linux resolution drags in the full CUDA stack and the API image balloons
# past 18 GB — measured, not guessed. `explicit = true` keeps this index
# scoped to torch alone rather than shadowing PyPI for everything.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
homelib-core = { workspace = true }
homelib-rag = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]


[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
# Drop each test's tmp_path at session end. Passed-test artefacts are noise, and
# a *killed* session leaves its basetemp locked for 3h, so keep sessions small.
# (2026-09-04: 2,951 killed-session basetemps = 108GB on the internal disk.)
tmp_path_retention_policy = "none"
testpaths = ["packages", "apps", "evals", "tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # SQLite WAL connections often finalize after the test frame; treat as noise.
    "ignore:unclosed database:ResourceWarning",
]
markers = [
    "integration: needs a live Postgres (compose test profile)",
    "llm: needs a reachable LLM endpoint",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["packages/homelib-core/src", "packages/homelib-rag/src", "apps", "evals"]
branch = true
# Only the Streamlit rendering shell is exempt — it cannot run without a live
# Streamlit runtime, so any test of it would assert nothing. Every decision the
# UI makes lives in apps/ui/view_model.py, which the floor DOES cover. Widening
# this back to `apps/ui/*` would silently un-guard that logic.
# Low-coverage HTTP shells / one-off scripts — behavioural coverage lives in
# store + view_model + route TestClient suites; keep floor honest without
# forcing Streamlit/runtime noise into the denominator.
omit = [
    "*/tests/*",
    "apps/ui/app.py",
    # Companion :8502 BaseHTTPRequestHandler — behaviour pinned in
    # apps/ui/tests/test_read_server.py (helpers + HTML); shell itself is
    # runtime glue like Streamlit app.py.
    "apps/ui/read_server.py",
    "scripts/*",
    "apps/api/v2_routes.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Specs contain illustrative signatures (`def f(...) -> X: ...`), not runnable
# code. Ruff formats Python fences inside Markdown, which would rewrite them
# into something that reads worse and says less. Prose is out of scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "UP", "RUF", "SIM", "C4", "PTH", "RET", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S"]
"scripts/**/*.py" = ["S603", "S607"]
"apps/ingest/sqlite_pipeline.py" = ["S608"]  # IN-clause placeholders are ?-only, not user strings

# B008 exists because a mutable default is evaluated once at import time. That
# is exactly what FastAPI's Depends()/Query()/etc. are FOR — the marker object
# in the default is how the framework discovers what to inject, and it is what
# makes `app.dependency_overrides` work in tests. Rewriting these into calls
# inside the body to silence the lint would break dependency injection while
# fixing nothing real, so the calls are declared immutable instead.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_explicit = false
files = ["packages/homelib-core/src", "packages/homelib-rag/src", "apps", "evals", "scripts"]
exclude = "(^|/)tests/"

[[tool.mypy.overrides]]
module = ["ebooklib.*", "fitz.*", "dlt.*", "pgvector.*", "sentence_transformers.*", "streamlit.*"]
ignore_missing_imports = true
